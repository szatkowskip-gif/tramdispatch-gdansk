[project]
name = "tramdispatch"
version = "0.1.0"
description = "Narzędzie doradcze dla dyspozytora tramwajowego w Gdańsku (otwarte dane OSM + ZTM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "networkx>=3.3",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tramdispatch = "backend.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
