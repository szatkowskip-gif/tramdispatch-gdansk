# Adresy zewnętrzne. Zmieniaj tutaj, nie w kodzie.
[ztm]
gps_positions = "https://ckan2.multimediagdansk.pl/gpsPositions?v=2"
display_messages = "https://ckan2.multimediagdansk.pl/displayMessages"
gtfs_zip = "https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/30e783e4-2bec-4a7d-bb22-ee3e3b26ca96/download/gtfsgoogle.zip"
poll_interval_s = 15
history_retention_h = 24

[osm]
overpass_url = "https://overpass-api.de/api/interpreter"
user_agent = "tramdispatch-gdansk/0.1"
overpass_fallbacks = ["https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter"]

[routing]
max_detour_extra_m = 4000
turnback_search_radius_m = 5000
crossover_max_length_m = 80
loop_max_length_m = 1600
position_match_radius_m = 60

[shuttle]
# ruch wahadłowy po jednym torze
speed_kmh = 25            # prędkość na odcinku jednotorowym
margin_s = 40             # czas na zmianę kierunku ruchu na mijance (zwrotnice, łączność)
trips_per_line_per_h = 6  # szacunek szczytowy do oceny przepustowości (brak stop_times w repo)
max_single_track_m = 2500 # powyżej tej długości program nie proponuje wahadła

[server]
host = "127.0.0.1"
port = 8766
